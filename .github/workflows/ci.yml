name: eClass CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality-checks:
    name: Code Quality Checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci        # npm ci enforces identical, reproducible builds and prevents unintended dependency upgrades that can break your production code. package-lock.json

      - name: Run lint
        run: npm run lint

      - name: Check backend TypeScript
        run: npm run typecheck --workspace backend

      - name: Build frontend and backend
        run: npm run build
